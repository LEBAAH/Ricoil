<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RICOIL YouTube Ad</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="ad-container">
        <div class="background-image"></div>
        <div class="background-overlay"></div>
        
        <header class="ad-header">
            <img src="logo.png" alt="RICOIL Logo" class="logo animate-drop">
        </header>

        <main class="ad-content">
            <div class="text-group">
                <h1 class="headline animate-fade-in">Turn Waste Oil Into Sustainable Biofuel</h1>
                <p class="sub-headline animate-fade-in-delayed">Reliable UK-Wide Collection Service</p>
            </div>
        </main>

        <footer class="ad-footer">
            <a href="https://lebaah.github.io/Ricoil/contact.html" class="cta-button animate-pulse">GET A FREE QUOTE</a>
        </footer>
        
        <div class="oil-drop drop-1"></div>
        <div class="oil-drop drop-2"></div>
    </div>
</body>
</html>
